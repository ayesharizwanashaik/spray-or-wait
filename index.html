todo:["What to do","ఏమి చేయాలి"],todo2:["What to do, in this order","ఈ క్రమంలో చేయండి"],

foot:["MVP prototype. Action limits and weather rules are illustrative placeholders to replace with verified ANGRAU / ICAR values. Weather is entered by hand here; the WhatsApp version will pull a live forecast.","MVP నమూనా. చర్య పరిమితులు, వాతావరణ నియమాలు ఉదాహరణ విలువలు మాత్రమే; వాటిని ధృవీకరించిన ANGRAU / ICAR విలువలతో మార్చాలి. ఇక్కడ వాతావరణం చేతితో ఇస్తారు; WhatsApp వెర్షన్ లైవ్ ఫోర్కాస్ట్ తీసుకుంటుంది."]};
function risk(f,h,r){const rr=r!=="none";let s=0;
if(f==="wet")s=(h>=80?2:h>=70?1:0)+(rr?1:0);
else if(f==="dry")s=(h<60?2:h<70?1:0)+(r==="none"?1:0);
else s=1+(h>=80&&rr?1:0);
return s>=3?"high":s===2?"med":"low"}
function stageOf(c,d){return D[c].st.find(s=>d>=s[0]&&d<s[1])||D[c].st[D[c].st.length-1]}
function decide(c,pi,a,h,r,d){const p=D[c].p[pi],st=stageOf(c,d);
const lim=Math.round(p[4]*(st[4]?0.7:1)*10)/10,rk=risk(p[3],h,r);let k,days;
if(a>=lim){k="act";days=3}else if(rk==="high"&&a>=lim*0.4){k="prev";days=2}else{k="wait";days=rk==="high"?2:rk==="med"?3:5}
return{k,days,lim,rk,st,p}}
/*END-LOGIC*/
let crop="chilli",L=0,rain="light";
const $=id=>document.getElementById(id),T=k=>S[k][L];
function render(){
const pi=+$("pest").value||0,a=+$("aff").value,h=+$("hum").value,d=+$("das").value||0;
const x=decide(crop,pi,a,h,rain,d),p=x.p,st=x.st,k=x.k;
$("affv").textContent=a+"%";$("humv").textContent=h+"%";
$("stg").textContent=T("stg")+st[2+L]+(st[4]?T("sens"):"");
const pn=p[L],tp=T(p[2]==="d"?"dis":"pst");
let o=`<span class="tag">${T(k)}</span><h2>${k==="act"?T("as"):k==="prev"?T("ps"):S.ws[L](x.days)}</h2>`;
if(k==="act"&&(rain==="heavy"||rain==="storm"))o+=`<div class="warn"><b>${T("rainAct")}</b></div>`;
if(k==="prev"&&rain!=="none")o+=`<div class="warn"><b>${T("rainPrev")}</b></div>`;
o+=`<h3>${T("why")}</h3><ul><li>${S.w1[L](a,x.lim,pn)}</li><li>${S.w2[L](tp,S.rk[x.rk][L])}</li><li>${S.w3[L](st[2+L],st[4])}</li></ul>`;
if(k==="wait")o+=`<h3>${T("todo")}</h3><ul><li>${S.scout[L](x.days)}</li><li>${T("photo")}</li><li><b>${T("cul")}</b>${p[5+L]}</li></ul>`;
else{o+=`<h3>${T("todo2")}</h3><ul><li><b>${T("cul")}</b>${p[5+L]}</li><li><b>${T("bio")}</b>${p[7+L]}</li><li>${k==="act"?T("chem"):S.nochem[L](x.lim)}</li></ul><h3>${T("chk")}</h3><p>${S.chk2[L](x.days)}</p>`}
const r=$("res");r.className="card "+k;r.innerHTML=o}
function fillPests(){$("pest").innerHTML=D[crop].p.map((p,i)=>`<option value="${i}">${p[L]}</option>`).join("")}
function build(){
$("crops").innerHTML=Object.keys(D).map(c=>`<button class="crop" data-c="${c}" aria-pressed="${c===crop}"><span class="e">${D[c].e}</span>${D[c].n[L]}</button>`).join("");
$("wx").innerHTML=W.map((w,i)=>`<button data-w="${i}" aria-pressed="false">${w[0]} ${w[1+L]}</button>`).join("");
$("rain").innerHTML=RN.map(r=>`<button data-r="${r[0]}" aria-pressed="${r[0]===rain}">${r[1+L]}</button>`).join("")}
function labels(){$("h1").textContent=T("h1");$("sub").textContent=T("sub");$("l-crop").textContent=T("crop");$("l-pest").textContent=T("pest");$("l-das").textContent=T("das");$("l-aff").textContent=T("aff");$("n-aff").textContent=T("naff");$("l-wx").textContent=T("wx");$("l-hum").textContent=T("hum");$("l-rain").textContent=T("rain");$("demo").textContent=T("demo");$("foot").textContent=T("foot");document.documentElement.lang=L?"te":"en"}
function refresh(){const v=$("pest").value;build();fillPests();if(v)$("pest").value=v;labels();render()}
$("crops").onclick=e=>{const b=e.target.closest("button");if(!b)return;crop=b.dataset.c;build();fillPests();render()};
$("wx").onclick=e=>{const b=e.target.closest("button");if(!b)return;const w=W[+b.dataset.w];$("hum").value=w[3];rain=w[4];build();[...$("wx").children].forEach(c=>c.setAttribute("aria-pressed",c===b));render()};
$("rain").onclick=e=>{const b=e.target.closest("button");if(!b)return;rain=b.dataset.r;build();render()};
["pest","das","aff","hum"].forEach(i=>$(i).addEventListener("input",render));
function setLang(l){L=l;$("en").setAttribute("aria-pressed",!l);$("te").setAttribute("aria-pressed",!!l);refresh()}
$("en").onclick=()=>setLang(0);$("te").onclick=()=>setLang(1);
$("demo").onclick=()=>{crop="chilli";rain="light";build();fillPests();$("pest").value="2";$("das").value=75;$("aff").value=2;$("hum").value=85;render()};
build();fillPests();$("pest").value="2";labels();render();
</script></body></html>
